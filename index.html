        buildDrawSlotsMain(); // ✅ 保证主奖界面一定是2框

        const levelId=state.currentLevelId;
        const lv=prizeLevels.find(x=>x.id===levelId);

        // 如果当前级别已抽完：先等一次空格再切档，中间可按「禁用空格」暂停
        if(mainLevelFinished(levelId)){
          awaitingNextLevel = true;
          setStatus(`本档已抽完，按空格切下一档（可先按「禁用空格」暂停）`);
          showToast("本档已抽完，按空格输入验证码切下一档");
          return;
        }

        if(runtime.machine==="IDLE"){
          runtime.machine="SHOW_PRIZE";
          const ok=showPrizeFirst(levelId);
          if(!ok) runtime.machine="IDLE";
          return;
        }

        if(runtime.machine==="SHOW_PRIZE"){
          // 确保弹窗已经显示完毕
          if(!prizeOverlayReady){
            setStatus(`⏳ 请稍候，奖品正在显示...`);
            return;
          }
          runtime.machine="ROLL_PERSON";
          setStatus(`🎯 ${lv.name} 开始摇人：再按一次锁定`);
          loopRollingPerson(levelId);
          return;
        }

        if(runtime.machine==="ROLL_PERSON"){
          // 检查是否真的在摇人（防止暂停后直接揭晓）
          if(runtime.rollingLevelId === null || runtime.rollingLevelId !== levelId){
            // 如果摇人已停止，需要重新显示奖品图片并开始摇人
            const items = state.prizeLeft[levelId] || [];
            if(items.length > 0){
              const prizeItem = items[items.length - 1];
              showPrizeImage([prizeItem], lv.name, levelId);
            }
            runtime.machine="ROLL_PERSON";
            setStatus(`🎯 ${lv.name} 开始摇人：再按一次锁定`);
            loopRollingPerson(levelId);
            return;
          }
          
          // 停止摇人并揭晓（finalizeMainWinner会设置WAIT_CONFIRM状态）
          stopRollingAll();
          runtime.rollingLevelId=null;
          finalizeMainWinner(levelId);
          // 状态已在 finalizeMainWinner 中设置为 WAIT_CONFIRM
          return;
        }
        
        // 如果状态是REVEAL，说明正在揭晓中，忽略按键
        if(runtime.machine==="REVEAL"){
          return;

      // JOY
      if(state.phase==="JOY"){

          return;

        // IDLE -> SHOW_JOY_PRIZE -> ROLLING -> REVEAL -> IDLE
        if(runtime.machine==="IDLE"){
          // 显示当前批次的奖品图片
          runtime.machine="SHOW_JOY_PRIZE";
          buildDrawSlotsJoy(count);
          
          // 获取当前批次的奖品（从奖池末尾取count个）
          const items = state.prizeLeft[4] || [];
          const batchPrizes = items.slice(-count).reverse(); // 取最后count个，反转顺序
          runtime.joyBatchPrizes = batchPrizes; // 保存当前批次奖品
          
          // 显示奖品图片弹窗
          showPrizeImage(batchPrizes, "喜乐同行", 4);
          
          setStatus(`🎁 喜乐同行（${count}个）：按一次开始摇人`);
          return;
        }

        if(runtime.machine==="SHOW_JOY_PRIZE"){
          // 确保弹窗已经显示完毕
          if(!prizeOverlayReady){
            setStatus(`⏳ 请稍候，奖品正在显示...`);
            return;
          }
          // 如果剩余人数 <= 奖品数，直接揭晓（不需要摇人）
          if(state.remainingPeople.length <= count){
            runtime.machine="REVEAL";
            runtime.rollingLevelId=null;
            finalizeJoyBatch(count);
            return;
          }
          // 保持奖品图片显示，在图片下面滚动名字
          runtime.machine="ROLLING";
          setStatus(`🎯 喜乐同行 批量摇人（${count}个）：再按一次揭晓`);
          loopRollingJoy(count);
          return;
        }

        if(runtime.machine==="ROLLING"){
          // 检查是否真的在摇人（防止暂停后直接揭晓）
          if(runtime.rollingLevelId === null || runtime.rollingLevelId !== 4){
            // 如果摇人已停止，需要重新开始摇人，并确保弹窗显示
            const items = state.prizeLeft[4] || [];
            const batchPrizes = items.slice(-count).reverse();
            showPrizeImage(batchPrizes, "喜乐同行", 4);
            runtime.machine="ROLLING";
            setStatus(`🎯 喜乐同行 批量摇人（${count}个）：再按一次揭晓`);
            loopRollingJoy(count);

          stopRollingAll();
          runtime.machine="REVEAL";
          runtime.rollingLevelId=null;
          finalizeJoyBatch(count);

          return;

        // 如果状态是REVEAL，说明正在揭晓中，忽略按键
        if(runtime.machine==="REVEAL"){

    /* 绑定 UI */

        runtime.machine="IDLE";
        buildDrawSlotsMain();
        updateLevelSelect();

        setStatus("已切档：按一次先亮奖品");

      });

      document.getElementById("btnNextDefault").addEventListener("click", ()=>{
        unlockAllAudioOnce();
        // 只有在用户没有手动暂停的情况下才自动播放BGM
        if(!bgmStarted && !bgmManuallyPaused){
          try{
            ensureMuteState(bgm);
            bgm.play().then(()=>{
              bgmStarted=true;
              bgmIsPlaying=true;
            }).catch(()=>{});
          }catch(e){}
        }
        maybeResumeBgmAfterWin();

        stopRollingAll();
        runtime.machine="IDLE";
        buildDrawSlotsMain();

        setStatus("默认顺序：按一次先亮奖品");
      });

      // 禁用空格：点击后立即禁用按钮 600ms，只认一次，避免重复触发导致状态反了
      const btnFreezeEl = document.getElementById("btnFreeze");
      // 兜底：每次绑定 UI 时都把“禁用空格”状态复位，避免刷新/重开后出现卡死或按钮不可用
      // 说明：抽奖进度会从 localStorage 恢复，但 isFrozen/awaitingNextLevel 不做持久化，避免把页面锁死。
      isFrozen = false;
      btnFreezeEl.disabled = false;
      btnFreezeEl.innerHTML = "⏸ 禁用空格";
      btnFreezeEl.style.opacity = "1";
      btnFreezeEl.addEventListener("click", function(e){
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        if(btnFreezeEl.disabled) return;
        btnFreezeEl.disabled = true;
        setTimeout(function(){ btnFreezeEl.disabled = false; }, 600);

        isFrozen = !isFrozen;
        if(isFrozen){
          stopRollingAll();
          runtime.machine = "IDLE";
          btnFreezeEl.innerHTML = "▶ 恢复";
          btnFreezeEl.style.opacity = "0.8";

          showToast("⏸ 全屏已禁止，按「恢复」继续");
        } else {
          btnFreezeEl.innerHTML = "⏸ 禁用空格";
          btnFreezeEl.style.opacity = "1";

      }, true);

      document.getElementById("btnDraw").addEventListener("click", ()=>{
        unlockAllAudioOnce();
        // 只有在用户没有手动暂停的情况下才自动播放BGM
        if(!bgmStarted && !bgmManuallyPaused){
          try{
            ensureMuteState(bgm);
            bgm.play().then(()=>{
              bgmStarted=true;
              bgmIsPlaying=true;
            }).catch(()=>{});
          }catch(e){}
        }
        handleDrawAction();
      });

      // 禁用空格 + 抽奖锁定：在 keydown 捕获阶段统一拦截 Space / F5 / Ctrl+R / Enter
      document.addEventListener("keydown", (e)=>{
        if(e.repeat) return;
        const isSpace = (e.code==="Space" || e.key===" " || e.keyCode===32);
        const isRefreshHotkey = hasLotteryStarted && (
          e.key==="F5" || e.keyCode===116 ||
          (e.ctrlKey && (e.key==="r" || e.key==="R" || e.keyCode===82))
        );
        const isEnter = e.key==="Enter" || e.keyCode===13;

        // 抽奖开始后，屏蔽 F5 / Ctrl+R，防止误刷新
        if(isRefreshHotkey){
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
          showToast("抽奖进行中已锁定刷新快捷键（F5 / Ctrl+R）");
          return;
        }
        // 抽奖开始后，屏蔽回车键，防止误触“上一个焦点按钮”（如重置）导致误操作
        if(hasLotteryStarted && isEnter){
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
          showToast("抽奖进行中已禁用回车键（防止误触重置）");
          return;
        }

        // 只关心空格，其他键不处理
        if(!isSpace) return;

        if(isFrozen){
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
          return;
        }
        e.preventDefault();
        unlockAllAudioOnce();
        // 第一次按空格就立即开始 BGM（不等到开奖结果出来）
        if(!hasLotteryStarted){
          if(!bgmStarted && !bgmManuallyPaused){
            try{
              ensureMuteState(bgm);
              bgm.play().then(()=>{ bgmStarted=true; bgmIsPlaying=true; }).catch(()=>{});
            }catch(err){}
          }
        } else if(!bgmIsPlaying && !bgmManuallyPaused){
          playBgm();
        }
        handleDrawAction();
      }, true);

      // 抽奖开始后禁用鼠标右键，防止右键菜单切出/误触刷新
      document.addEventListener("contextmenu", (e)=>{
        if(hasLotteryStarted){
          e.preventDefault();
          e.stopPropagation();
          showToast("抽奖进行中已禁用右键菜单");
        }
      }, true);

      document.getElementById("btnCopy").addEventListener("click", copyRecords);
      document.getElementById("btnReset").addEventListener("click", ()=>{
        resetAll();
      });
      
      // 静音功能：只用 isMuted 变量，每次点击强制翻转，确保不会错乱
      const btnMuteEl = document.getElementById("btnMute");
      let lastMuteAction = 0;
      function toggleMute(){
        const now = Date.now();
        if(now - lastMuteAction < 500) return; // 500ms 防抖
        lastMuteAction = now;
        
        // 直接翻转 isMuted，不读任何外部状态
        isMuted = !isMuted;
        
        // 立即应用到所有音频
        bgm.muted = isMuted;
        winSfx.muted = isMuted;
        bgm.volume = isMuted ? 0 : 1;
        winSfx.volume = isMuted ? 0 : 1;
        document.querySelectorAll('audio').forEach(a=>{
          a.muted = isMuted;
          a.volume = isMuted ? 0 : 1;
        });
        
        // 更新按钮显示（主按钮 + 现场控制旁隐藏快捷钮）
        if(btnMuteEl){
          if(isMuted){
            btnMuteEl.innerHTML = "🔇 取消静音";
            btnMuteEl.style.opacity = "0.7";
            showToast("🔇 已静音");
          } else {
            btnMuteEl.innerHTML = "🔊 静音";
            btnMuteEl.style.opacity = "1";
            showToast("🔊 已恢复声音");
          }
        }
        const btnMuteShortcutEl = document.getElementById("btnMuteShortcut");
        if(btnMuteShortcutEl) btnMuteShortcutEl.innerHTML = isMuted ? "🔇" : "🔊";
      }
      function applyMuteToAudio(audio) {
        if(audio) { audio.muted = isMuted; if(isMuted) audio.volume = 0; }
      }
      // 确保初始状态：按钮显示"静音"，isMuted=false
      if(btnMuteEl && isMuted === false){
        btnMuteEl.innerHTML = "🔊 静音";
        btnMuteEl.style.opacity = "1";
      }
      if(btnMuteEl){
        btnMuteEl.addEventListener("click", function(e){
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation(); // 阻止其他监听器
          toggleMute();
        }, true); // 用 capture 阶段，优先执行
      }
      const btnMuteShortcut = document.getElementById("btnMuteShortcut");
      if(btnMuteShortcut) btnMuteShortcut.addEventListener("click", function(e){
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        if(btnMuteEl) btnMuteEl.click();
      }, true);
      // M 键静音已移除，避免与用户按键冲突，静音请用面板「静音」按钮
      document.getElementById("btnBackToNormal").addEventListener("click", ()=>{
        backToNormal();
      });
      
      // 显示预设模式
      const presetSelect = document.getElementById("presetSelect");
      const savedPreset = localStorage.getItem('displayPreset') || 'normal';
      presetSelect.value = savedPreset;
      applyPreset(savedPreset);
      
      presetSelect.addEventListener("change", (e)=>{
        const preset = e.target.value;
        applyPreset(preset);
        localStorage.setItem('displayPreset', preset);
        showToast(`已切换为${e.target.selectedOptions[0].text}`);
      });
    }
    
    function applyPreset(preset){
      // 移除所有模式类
      document.body.classList.remove('mode-normal','mode-bigscreen');
      // 添加对应的模式类
      if(preset === 'normal'){
        document.body.classList.add('mode-normal');
      }else if(preset === 'bigscreen'){
        document.body.classList.add('mode-bigscreen');
      }
    }

    /* 启动：加载存档或初始化 */
    function initApp(){
      try{
        stopRollingAll();
        runtime.machine="IDLE";
        runtime.currentPrizeText="";
        runtime.currentCandidate=null;

        // 确保 DOM 元素存在
        if(!document.getElementById("wrapGrand")){
          console.error('DOM 元素未加载完成');
          setTimeout(initApp, 100);
          return;
        }

        // 直接调用 initWall，如果不存在会抛出错误（由外层 try-catch 捕获）
        initWall();

        const ok=loadState();
        if(!ok){
          initFreshState(); // 首次初始化，不需要确认
        }else{
          normalizeState();

          const hasAny=[0,1,2,3,4].some(id=>Array.isArray(state.prizeLeft[id]) && state.prizeLeft[id].length);
          if(!hasAny){
            resetAll();
            return;
          }

          renderFromWinners();
          decidePhase();
          updateLevelSelect();
          updateStatsUI();

          if(state.phase==="JOY"){
            const c=joyBatchCount() || 5;
            setStatus(`继续喜乐同行：按空格显示奖品（${c}个）`);
          }else if(state.phase==="DONE"){
            setStatus("🎊 全部抽奖结束！（可导出记录）");
          }else{
            setStatus("继续主奖：按空格显示奖品");
          }

          showToast("✅ 已从本机存档恢复进度");
        }

        bindUI();
      }catch(error){
        console.error('初始化错误:', error);
        showToast(`⚠️ 初始化失败: ${error.message}`);
        // 尝试至少恢复数据
        try{
          const ok=loadState();
          if(ok && state.winners && state.winners.length > 0){
            showToast('✅ 检测到存档数据，请刷新页面重试');
          }
        }catch(e){
          console.error('数据恢复失败:', e);
        }
      }
    }

    // 检查所有关键函数是否已定义（安全方式）
    function checkRequiredFunctions(){
      const required = [
        'initWall', 'createWallSlot', 'fillWall', 'renderFromWinners',
        'buildDrawSlotsMain', 'buildDrawSlotsJoy', 'updateStatsUI',
        'updateLevelSelect', 'resetAll', 'loadState', 'saveState',
        'bindUI', 'handleDrawAction', 'stopRollingAll'
      ];
      const missing = [];
      for(const name of required){
        // 通过 window 对象安全地检查函数是否存在
        // 在浏览器中，全局函数会自动成为 window 的属性
        if(typeof window[name] !== 'function'){
          missing.push(name);
        }
      }
      if(missing.length > 0){
        console.error('缺少关键函数:', missing);
        return false;
      }
      return true;
    }

    // 确保 DOM 加载完成后再初始化
    function safeInit(){
      // 多次尝试初始化，确保所有 script 块都已执行
      let attempts = 0;
      const maxAttempts = 15; // 增加重试次数
      
      function tryInit(){
        attempts++;
        try{
          // 先检查关键函数是否存在
          if(typeof initWall === 'undefined' || typeof initWall !== 'function'){
            throw new Error('initWall is not defined');
          }
          // 直接尝试初始化
          initApp();
        }catch(error){
          const isInitWallError = error.message && (
            error.message.includes('initWall') || 
            error.message.includes('is not defined') ||
            error.name === 'ReferenceError'
          );
          
          if(isInitWallError){
            // initWall 未定义，等待后重试
            if(attempts < maxAttempts){
              console.log(`等待函数加载... (${attempts}/${maxAttempts})`);
              setTimeout(tryInit, 300); // 增加等待时间
            }else{
              console.error('初始化失败：initWall 函数未加载');
              showToast('⚠️ 初始化失败：关键函数未加载，请刷新页面');
              // 尝试恢复数据
              try{
                if(typeof loadState === 'function'){
                  const ok = loadState();
                  if(ok && state && state.winners && state.winners.length > 0){
                    showToast('✅ 检测到存档数据，请刷新页面恢复');
                  }
                }
              }catch(e){
                console.error('数据恢复失败:', e);
              }
            }
          }else{
            // 其他错误，直接显示
            console.error('初始化错误:', error);
            showToast(`⚠️ 初始化失败: ${error.message || error}`);
          }
        }
      }
      
      // 等待 DOM 和所有 script 块加载（增加初始等待时间）
      setTimeout(tryInit, 300);
    }

    // 使用 window.onload 确保所有资源都已加载
    if(document.readyState === 'complete'){
      // 页面已经完全加载
      safeInit();
    }else if(document.readyState === 'loading'){
      // 页面还在加载
      window.addEventListener('load', safeInit);
      // 同时也监听 DOMContentLoaded，哪个先触发就用哪个
      document.addEventListener('DOMContentLoaded', () => {
        setTimeout(safeInit, 200);
      });
    }else{
      // DOM 已加载但资源可能还在加载
      safeInit();
    }
  </script>
</body>
